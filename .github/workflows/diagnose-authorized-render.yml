name: Diagnose Authorized Person Render (runtime trace)

on:
  workflow_dispatch:
  push:
    paths:
      - "masters/**"
      - "app/**"
      - ".github/workflows/**"
      - "input/**"

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install python-docx

      - name: Prepare decision packet for two masters (workspace-only overwrite)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("input/decision_packet_test.json")

          if not p.exists():
              raise SystemExit("input/decision_packet_test.json not found")

          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          data["selected_masters"] = [
              {
                  "master_name": "MASTER_GIAY_UY_QUYEN_LAN_01_CTCP_CLEAN.docx",
                  "generation_order": 1
              },
              {
                  "master_name": "MASTER_GIAY_UY_QUYEN_LAN_02_CTCP_CLEAN.docx",
                  "generation_order": 2
              }
          ]

          p.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "WROTE temporary decision packet with two masters "
              "to input/decision_packet_test.json"
          )
          PY

      - name: Run production CLI main (will print TRACE logs)
        run: |
          python -u -m app.main

      - name: Post-check rendered outputs for placeholders (fail if any found)
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          placeholders = [
              "[NGÀY CẤP CCCD NGƯỜI UQ]",
              "[NƠI CẤP CCCD NGƯỜI UQ]"
          ]

          masters = [
              "MASTER_GIAY_UY_QUYEN_LAN_01_CTCP_CLEAN.docx",
              "MASTER_GIAY_UY_QUYEN_LAN_02_CTCP_CLEAN.docx"
          ]

          out_dir = Path("output")
          found_any = False

          for master in masters:
              out = out_dir / f"RENDERED_{master}"

              if not out.exists():
                  print("OUTPUT MISSING:", out)
                  found_any = True
                  continue

              doc = Document(str(out))

              for ph in placeholders:
                  present = any(
                      ph in paragraph.text
                      for paragraph in doc.paragraphs
                  )

                  print(
                      f"{out.name} | {ph} PRESENT = {present}"
                  )

                  if present:
                      found_any = True

          if found_any:
              print(
                  "DIAGNOSTIC: placeholders remain in outputs "
                  "-> failing job"
              )
              raise SystemExit(2)

          print(
              "DIAGNOSTIC: no target placeholders found in outputs"
          )
          PY
