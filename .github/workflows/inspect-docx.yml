name: Inspect DOCX placeholders
on:
  workflow_dispatch:

permissions: read-all

jobs:
  inspect_docx:
    name: Inspect DOCX placeholders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install python-docx lxml

      - name: Run inspection script
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Running inspect_docx_placeholders.py on the two masters..."
          python tools/inspect_docx_placeholders.py \
            masters/MASTER_GIAY_UY_QUYEN_LAN_01_CTCP_CLEAN.docx \
            masters/MASTER_GIAY_UY_QUYEN_LAN_02_CTCP_CLEAN.docx || true
